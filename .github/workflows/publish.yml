name: Publish Package to npm

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
permissions: write-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - run: bun i
      - run: bun lint
      - run: bun run build
      - run: bun lint
      - run: bun test --coverage --coverage-reporter=lcov --coverage-reporter=text
      - name: Upload to codecov.io
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
          files: ./coverage/lcov.info
        if: github.ref == 'refs/heads/main'

  changepacks:
    name: changepacks
    runs-on: ubuntu-latest
    permissions:
      # create pull request comments
      pull-requests: write

      # Actions > General > Workflow permissions for creating pull request
      # Create brench to create pull request
      contents: write
      id-token: write
    needs:
      - check
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          registry-url: "https://registry.npmjs.org"
          node-version: 24
      - run: bun i
      - run: bun run build
      - uses: changepacks/action@main
        id: changepacks
        with:
          publish: true
    outputs:
      changepacks: ${{ steps.changepacks.outputs.changepacks }}
